name: Test de Despliegue a Servidor Local

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Copiar archivos a IIS wwwroot
        run: |
          robocopy . C:\inetpub\wwwroot /MIR /XD .git .github /XF .gitignore
          if ($LASTEXITCODE -le 7) { exit 0 } else { exit $LASTEXITCODE }
